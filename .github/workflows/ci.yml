name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'macOS'
        name: Test native SaunaCore
        run: swift test --package-path native/SaunaCore
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
