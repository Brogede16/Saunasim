<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Saunatelt Camp Layer Test</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px; background: #171817; color: #f3eadb; }
      main { width: min(100%, 820px); border: 1px solid #6f5b43; background: #2d251e; box-shadow: 0 18px 48px #0008; }
      header { padding: 20px 22px 15px; border-bottom: 1px solid #6f5b43; }
      h1 { margin: 0; font-size: clamp(22px, 6vw, 34px); font-weight: 500; }
      p { margin: 7px 0 0; color: #cdbba5; line-height: 1.45; }
      .stage { position: relative; overflow: hidden; height: min(70vw, 570px); min-height: 420px; background: linear-gradient(145deg, #809d72 0 43%, #758e66 43% 100%); }
      .stage::before { content: ""; position: absolute; inset: 0; opacity: .28; background-image: radial-gradient(#bbcc9c 1px, transparent 1.5px); background-size: 22px 22px; }
      .path { position: absolute; z-index: 1; left: 0; right: 0; bottom: 78px; height: 58px; transform: skewY(-7deg); background: #aa9b7b; border-top: 3px solid #c5b993; border-bottom: 3px solid #897b61; }
      .layer { position: absolute; z-index: 2; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; }
      .base { width: 74%; left: 13%; bottom: -6%; }
      .arrival { width: 31%; left: 14.5%; bottom: 6.5%; opacity: 0; transition: opacity 120ms ease; }
      .arrival.visible { opacity: 1; }
      .door-anchor { position: absolute; z-index: 4; left: 32.2%; bottom: 16.5%; width: 12px; height: 12px; border: 2px solid #fff1a8; border-radius: 50%; background: #9b6f33; box-shadow: 0 0 0 2px #40301f; }
      .controls { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 22px 21px; border-top: 1px solid #6f5b43; }
      label { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 11px; border: 1px solid #7f6a50; background: #382d25; cursor: pointer; }
      label.fixed { color: #dfcfb8; cursor: default; }
      input { accent-color: #d19750; width: 17px; height: 17px; }
      .note { flex-basis: 100%; margin: 3px 0 0; font-size: 13px; color: #cdbba5; }
      @media (max-width: 480px) { body { padding: 0; } main { min-height: 100vh; border: 0; } .stage { height: 66vw; min-height: 370px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Saunatelt Camp: Layer Test</h1>
        <p>The base tent stays fixed. The arrival/shop patch replaces only the doorway zone; the gold marker is the permanent guest entry anchor.</p>
      </header>
      <section class="stage" aria-label="Saunatelt Camp layer composition test">
        <div class="path" aria-hidden="true"></div>
        <img class="layer base" src="./saunatelt-base-concept-v01.png" alt="Nordic canvas sauna tent base" />
        <img class="layer arrival" id="arrival-layer" src="./saunatelt-arrival-concept-v01.png" alt="Timber entrance and shop overlay" />
        <div class="door-anchor" title="Guest entry / shop anchor" aria-label="Guest entry and shop anchor"></div>
      </section>
      <section class="controls" aria-label="Layer controls">
        <label class="fixed"><input type="checkbox" checked disabled /> Base tent</label>
        <label><input id="arrival-toggle" type="checkbox" /> Arrival/shop level 1</label>
        <p class="note">This is a composition proof. The final production canvas will use fixed native dimensions and exact anchor coordinates.</p>
      </section>
    </main>
    <script>
      const toggle = document.querySelector("#arrival-toggle");
      const layer = document.querySelector("#arrival-layer");
      toggle.addEventListener("change", () => layer.classList.toggle("visible", toggle.checked));
    </script>
  </body>
</html>
