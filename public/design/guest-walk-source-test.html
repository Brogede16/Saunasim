<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Guest Walk Source Test</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #171817; color: #f3eadb; }
      main { width: min(100%, 620px); border: 1px solid #6f5b43; background: #2d251e; box-shadow: 0 18px 48px #0008; }
      header { padding: 20px 22px 15px; border-bottom: 1px solid #6f5b43; }
      h1 { margin: 0; font-size: clamp(22px, 6vw, 34px); font-weight: 500; }
      p { margin: 7px 0 0; color: #cdbba5; line-height: 1.45; }
      .stage { display: grid; place-items: center; min-height: 520px; padding: 20px; background: #090909; }
      canvas { display: block; width: min(100%, 384px); height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
      .controls { display: flex; justify-content: space-between; gap: 12px; padding: 15px 22px 20px; border-top: 1px solid #6f5b43; color: #d8c2a7; font-size: 14px; }
      kbd { border: 1px solid #967856; border-bottom-width: 3px; border-radius: 3px; padding: 1px 5px; background: #3d3027; color: #fff6e6; font: 12px ui-monospace, monospace; }
      @media (max-width: 480px) { body { padding: 0; } main { min-height: 100vh; border: 0; } .stage { min-height: 440px; padding: 10px; } .controls { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="title">Guest Walk: South Source</h1>
        <p>Frames play in source order: four across the top row, then four across the bottom row. The preview locks the centre and foot baseline from each frame's transparent silhouette.</p>
      </header>
      <section class="stage" aria-label="Raw eight-frame guest walk preview">
        <canvas id="sprite" width="384" height="512"></canvas>
      </section>
      <section class="controls">
        <span><kbd>Space</kbd> pause or play</span>
        <span id="readout">Frame 1 of 8</span>
      </section>
    </main>
    <script>
      const canvas = document.querySelector("#sprite");
      const context = canvas.getContext("2d");
      const readout = document.querySelector("#readout");
      const isEast = new URLSearchParams(window.location.search).get("asset") === "east";
      document.querySelector("#title").textContent = isEast ? "Guest Walk: East Source" : "Guest Walk: South Source";
      context.imageSmoothingEnabled = false;
      const sheet = new Image();
      let frame = 0;
      let playing = true;
      let frameWidth = 0;
      let frameHeight = 0;
      let lastFrameAt = 0;
      let offsets = [];

      function measureAnchors() {
        const analysis = document.createElement("canvas");
        analysis.width = canvas.width;
        analysis.height = canvas.height;
        const analysisContext = analysis.getContext("2d", { willReadFrequently: true });
        const bounds = [];

        for (let index = 0; index < 8; index += 1) {
          const column = index % 4;
          const row = Math.floor(index / 4);
          analysisContext.clearRect(0, 0, analysis.width, analysis.height);
          analysisContext.drawImage(sheet, column * frameWidth, row * frameHeight, frameWidth, frameHeight, 0, 0, canvas.width, canvas.height);
          const pixels = analysisContext.getImageData(0, 0, analysis.width, analysis.height).data;
          let left = canvas.width;
          let right = 0;
          let bottom = 0;
          for (let y = 0; y < canvas.height; y += 1) {
            for (let x = 0; x < canvas.width; x += 1) {
              const alpha = pixels[(y * analysis.width + x) * 4 + 3];
              if (alpha < 96) continue;
              left = Math.min(left, x);
              right = Math.max(right, x);
              bottom = Math.max(bottom, y);
            }
          }
          bounds.push({ center: (left + right) / 2, bottom });
        }

        const targetCenter = canvas.width / 2;
        const targetBottom = Math.max(...bounds.map((bound) => bound.bottom));
        offsets = bounds.map((bound) => ({ x: targetCenter - bound.center, y: targetBottom - bound.bottom }));
      }

      function render() {
        const column = frame % 4;
        const row = Math.floor(frame / 4);
        context.clearRect(0, 0, canvas.width, canvas.height);
        const offset = offsets[frame] ?? { x: 0, y: 0 };
        context.drawImage(
          sheet,
          column * frameWidth,
          row * frameHeight,
          frameWidth,
          frameHeight,
          offset.x,
          offset.y,
          canvas.width,
          canvas.height,
        );
        readout.textContent = `Frame ${frame + 1} of 8`;
      }

      function tick(timestamp) {
        if (playing && timestamp - lastFrameAt >= 154) {
          frame = (frame + 1) % 8;
          lastFrameAt = timestamp;
          render();
        }
        requestAnimationFrame(tick);
      }

      window.addEventListener("keydown", (event) => {
        if (event.code !== "Space" || event.repeat) return;
        event.preventDefault();
        playing = !playing;
      });

      sheet.addEventListener("load", () => {
        frameWidth = sheet.naturalWidth / 4;
        frameHeight = sheet.naturalHeight / 2;
        measureAnchors();
        render();
        requestAnimationFrame(tick);
      });
      sheet.src = isEast ? "./guest-walk-east-source-v01.png" : "./guest-walk-source-v03.png";
    </script>
  </body>
</html>
